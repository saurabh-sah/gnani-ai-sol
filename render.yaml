# Render blueprint for the FastAPI backend (Docker, includes ffmpeg).
# Fill in the secret values in the Render dashboard after creating the service.
services:
  - type: web
    name: audio-notes-api
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: SUPABASE_BUCKET
        value: audio
      - key: GNANI_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: RUN_WORKER_IN_API
        value: "true"
